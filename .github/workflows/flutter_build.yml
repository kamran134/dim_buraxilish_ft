name: Flutter Build (Android)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# ══════════════════════════════════════════════════════════
# СПИСОК СЕКРЕТОВ (Settings → Secrets and variables → Actions)
#
# Android (4 штуки):
#   ANDROID_KEYSTORE_BASE64     — keystore.jks в base64
#   ANDROID_KEY_ALIAS           — keyAlias
#   ANDROID_KEY_PASSWORD        — keyPassword
#   ANDROID_STORE_PASSWORD      — storePassword
#
# iOS is built in Codemagic (see codemagic.yaml), not here.
# ══════════════════════════════════════════════════════════

jobs:

  # ─────────────────────────────────────────────
  # ANDROID — Release APK
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
