# iOS build → TestFlight. Android is built locally (build_release bat), not here.
#
# One-time setup in Codemagic (codemagic.io, sign in with GitHub):
#   1. Team settings → Integrations → Developer Portal → add an App Store Connect
#      API key named exactly "DİM Buraxılış" (Issuer ID, Key ID, .p8 file).
#   2. Team settings → codemagic.yaml settings → Code signing identities →
#      iOS certificates → Generate certificate (Apple Distribution), then
#      iOS provisioning profiles → Fetch profiles (App Store, az.dim.buraxilish).
#   3. Start builds manually (no triggers below), branch of your choice.
#
# Version name comes from pubspec.yaml (`version: X.Y.Z+N`), same as Android;
# the build number is the latest TestFlight build + 1 (see Build IPA).
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: DİM Buraxılış

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6817806719
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.dim.buraxilish

    scripts:
      - name: Check Firebase config
        script: |
          test -f ios/Runner/GoogleService-Info.plist \
            || { echo "ios/Runner/GoogleService-Info.plist is missing (download it from Firebase console)"; exit 1; }

      - name: Apply signing profiles
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build IPA
        script: |
          # Build number = latest TestFlight build + 1, so iOS test builds do
          # not require bumping pubspec's +N (which Android shares).
          # Falls back to pubspec's +N if the lookup fails.
          BUILD_ARGS=""
          if LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
            BUILD_ARGS="--build-number=$((LATEST + 1))"
          fi
          echo "Build number args: ${BUILD_ARGS:-<pubspec>}"
          flutter build ipa --release $BUILD_ARGS \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Show signed entitlements
        script: |
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa
          unzip -q build/ios/ipa/*.ipa -d /tmp/ipa
          codesign -d --entitlements - /tmp/ipa/Payload/*.app

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
      email:
        recipients:
          - kazimi.msu@gmail.com
        notify:
          success: true
          failure: true
